<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Friend Match: a memory game for kids | Wavelength Psychology</title>
<meta name="description" content="A free memory matching game for kids. Flip the cards and find each pair of friends. Play alone or take turns with a grown-up.">
<link rel="canonical" href="https://wavelengthpsychology.com/games/friend-match">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Wavelength Psychology">
<meta property="og:title" content="Friend Match: a memory game for kids">
<meta property="og:description" content="Flip the cards and find each pair of friends. Play alone or take turns.">
<meta property="og:url" content="https://wavelengthpsychology.com/games/friend-match">
<meta property="og:image" content="https://wavelengthpsychology.com/final_logo.png">
<meta name="theme-color" content="#fbf8f1">
<link rel="icon" type="image/jpeg" href="/logo-no-text.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/games/play.css?v=3">
<style>
.screen{gap:12px}
.status{display:flex;align-items:center;gap:10px;width:100%;min-height:60px}
.status .buddy{flex:none;width:52px}
.status .msg{flex:1;min-width:0;text-align:left;font-size:.9375rem;line-height:1.3;text-wrap:balance}
.status .chips{flex:none}
.opts{gap:8px;flex-wrap:nowrap}
.opts .seg button{padding:0 clamp(9px,3vw,16px);font-size:clamp(.8125rem,3.600vw,.9375rem)}
.boardwrap{position:relative;flex:1;display:grid;place-items:center;width:100%;min-height:240px}
.board{display:grid;grid-template-columns:repeat(4,var(--cw,76px));gap:var(--gap,10px)}
.cardb{appearance:none;-webkit-appearance:none;width:var(--cw,76px);aspect-ratio:.82;padding:0;border:0;background:none;cursor:pointer;perspective:700px;border-radius:16px}
.cardb .in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.3,1.25,.5,1)}
.cardb.up .in{transform:rotateY(180deg)}
.cardb .bk,.cardb .f{position:absolute;inset:0;border-radius:calc(var(--cw,76px)*.2);-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cardb .bk{background:var(--teal);color:rgba(255,255,255,.92);font-size:calc(var(--cw,76px)*.4);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 4px 0 var(--teal-deep),0 10px 18px var(--shadow)}
.cardb .bk::before{content:"";position:absolute;inset:calc(var(--cw,76px)*.08);border-radius:calc(var(--cw,76px)*.13);border:2px solid rgba(255,255,255,.26)}
/* swap the two faces as the card passes edge-on, so the flip never depends on the browser hiding back faces */
.cardb .bk{visibility:visible;transition:visibility 0s .13s}
.cardb .f{visibility:hidden;transition:visibility 0s .13s}
.cardb.up .bk{visibility:hidden}
.cardb.up .f{visibility:visible}
.cardb:not(.up):active .in{transform:translateY(3px)}
.cardb .f{transform:rotateY(180deg);gap:1px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line),0 4px 0 #d8d3c7,0 10px 18px var(--shadow);font-size:clamp(.625rem,calc(var(--cw,76px)*.155),.875rem);font-weight:700;color:var(--ink);line-height:1.1;overflow:hidden}
.cardb .f svg{width:74%;height:auto}
.cardb.got .f{background:var(--sun-soft);box-shadow:inset 0 0 0 3px var(--sun-pop),0 4px 0 #d9a53a,0 10px 18px var(--shadow)}
.board.tiny .f>span{display:none}
.board.tiny .f svg{width:86%}
.cardb.got{animation:got .5s var(--spring)}
@keyframes got{40%{transform:scale(1.1) rotate(-3deg)}}
.cardb.no{animation:cardno .42s ease-in-out}
@keyframes cardno{20%{transform:translateX(-6px) rotate(-3deg)}45%{transform:translateX(5px) rotate(3deg)}70%{transform:translateX(-3px)}}
.cardb.wave .f svg{animation:wave 1s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@media (min-width:700px) and (min-height:900px){.status .buddy{width:84px}.status .msg{font-size:1.1875rem}}
</style>
</head>
<body class="game">
<header class="top"><div class="wrap">
  <a class="back" href="/games/"><span data-icon="back"></span>Games</a>
  <span class="name">Friend Match</span>
  <button class="snd" id="snd" type="button"></button>
</div></header>
<main><div class="wrap">
<section class="screen">
  <h1 class="sr">Friend Match</h1>
  <div class="status">
    <svg class="buddy" id="buddy" data-mood="ok" viewBox="0 0 120 138" aria-hidden="true"></svg>
    <p class="msg" id="msg" aria-live="polite">Find the pairs!</p>
    <p class="chips" id="score"></p>
  </div>
  <div class="row opts">
    <span class="seg" role="group" aria-label="Players"><button data-p="1" type="button" aria-pressed="true">1 player</button><button data-p="2" type="button" aria-pressed="false">2 players</button></span>
    <span class="seg" role="group" aria-label="Level"><button data-n="6" type="button" aria-pressed="true">Easy</button><button data-n="8" type="button" aria-pressed="false">Harder</button></span>
  </div>
  <div class="boardwrap" id="bw"><div class="board" id="board"></div></div>
  <div class="row"><button class="go soft" id="again" type="button">New game</button></div>
</section>
</div></main>
<p class="foot">A free game from <a href="/">Wavelength Psychology</a>. Nothing you do here is saved.</p>
<script src="/games/play.js?v=3"></script>
<script>
(function(){
var P=Play,$=P.$,d=document;
/* Eight friends. Drawn in code, so there are no image files to load. */
var KIDS=[
 {n:'Aamna', s:'#b9794f', h:'#2a1b14', k:'pony',  t:'#2f8f8f'},
 {n:'Bilaal',s:'#a8683f', h:'#1f1410', k:'short', t:'#e0a43a'},
 {n:'Mateo', s:'#d9a273', h:'#3b2314', k:'curly', t:'#d9603f'},
 {n:'Zuri',  s:'#6b4226', h:'#17100c', k:'puffs', t:'#7a63c9'},
 {n:'Linh',  s:'#f0cfa8', h:'#141414', k:'bob',   t:'#e56f8c'},
 {n:'Noor',  s:'#c98f62', h:'#3f7f86', k:'hijab', t:'#3f7f86'},
 {n:'Sam',   s:'#f6d7c0', h:'#b5532a', k:'short', t:'#4f7fd0', g:1},
 {n:'Kofi',  s:'#4f2f1c', h:'#0f0b09', k:'fade',  t:'#3fa56b'}
];
function face(k){
  var hair='';
  if(k.k==='pony')hair='<circle cx="84" cy="44" r="13" fill="'+k.h+'"/><path d="M22 52a28 28 0 0 1 56 0v-6a28 28 0 0 0-56 0Z" fill="'+k.h+'"/><path d="M22 54q6-22 28-24 22 2 28 24-10-14-28-14T22 54Z" fill="'+k.h+'"/>';
  if(k.k==='short')hair='<path d="M21 54q-2-34 29-34t29 34q-8-16-29-16T21 54Z" fill="'+k.h+'"/>';
  if(k.k==='fade')hair='<path d="M23 50q0-28 27-28t27 28q-8-12-27-12T23 50Z" fill="'+k.h+'"/>';
  if(k.k==='curly')hair='<g fill="'+k.h+'"><circle cx="28" cy="36" r="10"/><circle cx="40" cy="26" r="11"/><circle cx="54" cy="24" r="11"/><circle cx="67" cy="29" r="10"/><circle cx="75" cy="40" r="9"/><circle cx="23" cy="47" r="8"/></g>';
  if(k.k==='puffs')hair='<g fill="'+k.h+'"><circle cx="20" cy="30" r="14"/><circle cx="80" cy="30" r="14"/><path d="M22 52q0-30 28-30t28 30q-8-14-28-14T22 52Z"/></g>';
  if(k.k==='bob')hair='<path d="M18 74V50q0-30 32-30t32 30v24q-6-2-6-10V52q-10-12-26-12T24 52v12q0 8-6 10Z" fill="'+k.h+'"/>';
  var hij=k.k==='hijab'?'<path d="M14 92q-2-70 36-72 38 2 36 72-10 8-36 8t-36-8Z" fill="'+k.h+'"/>':'';
  var hijTop=k.k==='hijab'?'<path d="M24 54q2-26 26-26t26 26q-8-12-26-12T24 54Z" fill="'+k.h+'"/>':'';
  var glasses=k.g?'<g fill="none" stroke="#16253f" stroke-width="2.2"><circle cx="39" cy="57" r="8"/><circle cx="61" cy="57" r="8"/><path d="M47 57h6"/></g>':'';
  return '<svg viewBox="0 0 100 104" aria-hidden="true">'+hij+(k.k==='bob'||k.k==='pony'||k.k==='puffs'?hair:'')
   +'<path d="M26 104q0-22 24-22t24 22Z" fill="'+k.t+'"/><circle cx="50" cy="56" r="28" fill="'+k.s+'"/>'
   +(k.k==='bob'||k.k==='pony'||k.k==='puffs'?'<path d="M22 54q2-30 28-30t28 30q-8-14-28-14T22 54Z" fill="'+k.h+'"/>':hair)+hijTop
   +'<circle cx="39" cy="57" r="3.4" fill="#16253f"/><circle cx="61" cy="57" r="3.4" fill="#16253f"/>'
   +'<circle cx="32" cy="66" r="5" fill="#f29a8e" opacity=".55"/><circle cx="68" cy="66" r="5" fill="#f29a8e" opacity=".55"/>'
   +'<path d="M41 68q9 9 18 0" fill="none" stroke="#16253f" stroke-width="2.6" stroke-linecap="round"/>'+glasses+'</svg>';
}
var bud=$('buddy'),msg=$('msg'),board=$('board'),players=1,pairs=6,turn=0,score=[0,0],moves=0,open=[],lock=false,left=0,tm=null,tm2=null,riseT=null;
/* size the cards to the space there is, so the whole board always fits */
function fit(){board.style.position='absolute';var w=$('bw').clientWidth,h=$('bw').clientHeight,rows=pairs/2,gap=w<360?8:10,big=window.innerWidth>=700&&window.innerHeight>=900,
    cw=Math.max(48,Math.floor(Math.min((w-3*gap)/4,(h-(rows-1)*gap)/rows*.82,big?156:112)));
  board.style.position='';board.style.setProperty('--cw',cw+'px');board.style.setProperty('--gap',(big?14:gap)+'px');board.classList.toggle('tiny',cw<60);}
function paint(){
  $('score').innerHTML=players===1?'<span class="chip">Turns: '+moves+'</span><span class="chip">Pairs: '+(pairs-left)+'/'+pairs+'</span>'
    :'<span class="chip'+(turn===0&&left?' turn':'')+'">P1: '+score[0]+'</span><span class="chip'+(turn===1&&left?' turn':'')+'">P2: '+score[1]+'</span>';}
function hint(){P.say(msg,players===1?'Find the pairs!':'Player '+(turn+1)+', your turn!');}
function deal(){clearTimeout(tm);clearTimeout(tm2);clearTimeout(riseT);P.clearConfetti();
  var kids=KIDS.slice().sort(function(){return Math.random()-.5;}).slice(0,pairs),deck=kids.concat(kids);
  for(var i=deck.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=deck[i];deck[i]=deck[j];deck[j]=x;}
  turn=0;score=[0,0];moves=0;open=[];lock=false;left=pairs;P.mood(bud,'ok');bud.classList.remove('bounce');
  board.innerHTML=deck.map(function(k,i){return '<button class="cardb rise" style="--i:'+(i*.5)+'" type="button" data-n="'+k.n+'" data-i="'+(i+1)+'" aria-label="Card '+(i+1)+', face down"><span class="in"><span class="bk">'+P.icon('sparkle')+'</span><span class="f">'+face(k)+'<span>'+k.n+'</span></span></span></button>';}).join('');
  fit();paint();hint();
  /* once the cards have arrived, drop the entrance animation so a resize cannot replay it */
  riseT=setTimeout(function(){P.all('.cardb').forEach(function(x){x.classList.remove('rise');});},1500);}
board.addEventListener('click',function(e){
  var c=e.target.closest('.cardb');if(!c||lock||c.classList.contains('up'))return;
  c.classList.add('up');c.setAttribute('aria-label',c.getAttribute('data-n'));P.sfx.tap();P.buzz(8);open.push(c);
  if(open.length<2)return;
  moves++;var a=open[0],b=open[1];open=[];
  if(a.getAttribute('data-n')===b.getAttribute('data-n')){score[turn]++;left--;lock=true;
    tm=setTimeout(function(){a.classList.add('got');b.classList.add('got');P.sfx.good();P.burst(a,{n:7,r:44});P.burst(b,{n:7,r:44});P.mood(bud,'happy');P.react(bud,'hop');lock=false;
      if(left===0){P.say(msg,players===1?'You found them all in '+moves+' turns!':score[0]===score[1]?'A tie! Great game.':'Player '+(score[0]>score[1]?1:2)+' wins! Great game.');
        bud.classList.add('bounce');P.all('.cardb').forEach(function(x){x.classList.add('wave');});P.sfx.win();P.confetti();}
      else P.say(msg,players===1?'A match! Hi, '+a.getAttribute('data-n')+'!':'A match! Player '+(turn+1)+' goes again.');
      paint();},380);
  }else{lock=true;P.mood(bud,'ok');
    tm=setTimeout(function(){a.classList.add('no');b.classList.add('no');P.tone(200,0,.12,'sine',.08);},420);
    tm2=setTimeout(function(){[a,b].forEach(function(x){x.classList.remove('up','no');x.setAttribute('aria-label','Card '+x.getAttribute('data-i')+', face down');});
      if(players===2)turn=1-turn;lock=false;paint();P.say(msg,players===1?'Not a match. Try again!':'Player '+(turn+1)+', your turn!');},1250);}
  paint();
});
P.all('.seg button').forEach(function(b){b.addEventListener('click',function(){P.sfx.tap();
  var key=b.hasAttribute('data-p')?'data-p':'data-n';P.all('.seg ['+key+']').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
  if(key==='data-p')players=+b.getAttribute('data-p');else pairs=+b.getAttribute('data-n');deal();});});
$('again').addEventListener('click',function(){P.sfx.tap();deal();});
window.addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe($('bw'));
deal();window.addEventListener('load',fit);
})();
</script>
</body>
</html>
