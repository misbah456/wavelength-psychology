<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Copy Cat: a pattern memory game | Wavelength Psychology</title>
<meta name="description" content="A free memory game for kids. Watch the lights, then copy the pattern. Each round adds one more.">
<link rel="canonical" href="https://wavelengthpsychology.com/games/copy-cat">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Wavelength Psychology">
<meta property="og:title" content="Copy Cat: a pattern memory game">
<meta property="og:description" content="A free memory game for kids. Watch the lights, then copy the pattern. Each round adds one more.">
<meta property="og:url" content="https://wavelengthpsychology.com/games/copy-cat">
<meta property="og:image" content="https://wavelengthpsychology.com/final_logo.png">
<meta name="theme-color" content="#fbf8f1">
<link rel="icon" type="image/jpeg" href="/logo-no-text.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/games/play.css">
<style>
.screen{gap:16px;padding-block:18px 22px}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:min(22rem,40vh)}
.padb{appearance:none;-webkit-appearance:none;aspect-ratio:1;border:0;border-radius:28px;cursor:pointer;opacity:.5;transition:opacity .08s,transform .08s}
.padb.lit,.padb:active{opacity:1;transform:scale(1.04)}
.padb:nth-child(1){background:var(--teal-pop)}.padb:nth-child(2){background:var(--sun-pop)}.padb:nth-child(3){background:var(--coral-pop)}.padb:nth-child(4){background:var(--blue-pop)}
.pads.lock .padb{pointer-events:none}
.msg{min-height:1.6em;font-weight:700;color:var(--ink)}
.lvl{font-weight:800;font-size:1.25rem;color:var(--teal)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="back" href="/games/">‹ Games</a>
  <span class="name">Copy Cat</span>
  <button class="pill-btn" id="snd" type="button" aria-pressed="true">Sound on</button>
</div></header>
<main><div class="wrap" style="flex:1;display:flex;flex-direction:column">
<section class="screen">
  <h1>Copy Cat</h1>
  <p class="sub">Watch the lights. Then tap them in the same order. Each round adds one more!</p>
  <p class="lvl" id="lvl" aria-live="polite">Round 1</p>
  <div class="pads lock" id="pads"><button class="padb" type="button" aria-label="Green"></button><button class="padb" type="button" aria-label="Yellow"></button><button class="padb" type="button" aria-label="Red"></button><button class="padb" type="button" aria-label="Blue"></button></div>
  <p class="msg" id="msg" aria-live="polite"></p>
  <div class="row"><button class="go" id="start" type="button">Start</button></div>
</section>
</div></main>
<p class="foot wrap">A free game from <a href="/">Wavelength Psychology</a>. Nothing you do here is saved.</p>
<script src="/games/buddy.js"></script>
<script>
(function(){
var d=document,$=function(id){return d.getElementById(id);},sound=true,ac=null;
function tone(f,t,dur,type,vol){if(!sound)return;var A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!ac)ac=new A();if(ac.state==='suspended')ac.resume();
  var o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+(t||0);o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol||.1,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+dur);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+dur+.05);}
$('snd').addEventListener('click',function(){sound=!sound;this.setAttribute('aria-pressed',sound?'true':'false');this.textContent=sound?'Sound on':'Sound off';});

var pads=[].slice.call(d.querySelectorAll('.padb')),box=$('pads'),seq=[],at=0,best=0,F=[330,392,494,587];
function flash(k,ms){pads[k].classList.add('lit');tone(F[k],0,.28,'triangle',.12);setTimeout(function(){pads[k].classList.remove('lit');},ms||380);}
function play(){box.classList.add('lock');$('msg').textContent='Watch…';$('lvl').textContent='Round '+seq.length;var j=0;
  (function step(){if(j<seq.length){flash(seq[j]);j++;setTimeout(step,620);}else{box.classList.remove('lock');$('msg').textContent='Your turn!';at=0;}})();}
function grow(){seq.push(Math.floor(Math.random()*4));setTimeout(play,650);}
pads.forEach(function(p,k){p.addEventListener('click',function(){flash(k,200);
  if(k!==seq[at]){box.classList.add('lock');best=Math.max(best,seq.length-1);$('msg').textContent='So close! You remembered '+(seq.length-1)+' in a row.';tone(160,.1,.3,'square',.07);$('start').textContent='Try again';$('start').hidden=false;return;}
  at++;if(at===seq.length){box.classList.add('lock');$('msg').textContent='Yes!';tone(784,.2,.2);grow();}});});
$('start').addEventListener('click',function(){this.hidden=true;seq=[];grow();});

})();
</script>
</body>
</html>
